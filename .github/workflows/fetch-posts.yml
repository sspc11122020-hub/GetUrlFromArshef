name: Auto Archive Blogger Posts

on:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات
  workflow_dispatch: # لتشغيله يدوياً بأي وقت

jobs:
  archive-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Fetch Script
        run: node fetch-posts.js

      - name: Commit and Push New Archived Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add arsh/
          git commit -m "Auto Archive: Added new posts to /arsh [skip ci]" || exit 0
          git push
